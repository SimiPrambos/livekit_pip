name: livekit_pip

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/livekit_pip.yaml"
      - "livekit_pip/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/livekit_pip.yaml"
      - "livekit_pip/**"

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1.21.0
    with:
      flutter_version: 3.44.9
      working_directory: livekit_pip
      test_optimization: false
      coverage_excludes: "**/*.g.dart"
      min_coverage: 0
